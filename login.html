
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
    <title>تسجيل الدخول - زاد المسلم</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 85%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 4px 15px #ccc;
        }

        h1 {
            color: #216b45;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #216b45;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
        }

        a {
            color: #216b45;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>🌙 زاد المسلم</h1>

        <h2>تسجيل الدخول</h2>

        <p>مرحباً بك في زاد المسلم</p>

        <form>
            <input type="email"
            placeholder="البريد الإلكتروني" required>

            <input type="password"
            placeholder="كلمة المرور" required>

            <button type="submit">دخول</button>
        </form>

        <p>ليس لديك حساب؟ <a href="register.html">إنشاء حساب</a></p>

        <a href="index.html">العودة للرئيسية</a>

    </div>

</body>
</html>
