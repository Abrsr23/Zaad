
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
    <title>تواصل معنا - زاد المسلم</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f4;
            margin: 0;
            text-align: center;
        }

        header {
            background: #216b45;
            color: white;
            padding: 25px;
        }

        .contact-box {
            background: white;
            max-width: 400px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ccc;
        }

        h2 {
            color: #216b45;
        }

        input, textarea {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background: #216b45;
            color: white;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 8px;
            font-size: 17px;
        }

        a {
            color: #216b45;
            text-decoration: none;
        }

        footer {
            background: #216b45;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>🌙 زاد المسلم</h1>
    <p>يسعدنا تواصلك معنا</p>
</header>

<div class="contact-box">

    <h2>تواصل معنا</h2>

    <p>إذا كان لديك استفسار أو اقتراح، أرسل لنا رسالتك.</p>

    <form>
        <input type="text" placeholder="الاسم الكامل" required>

        <input type="email" placeholder="البريد الإلكتروني" required>

        <textarea rows="5" placeholder="اكتب رسالتك هنا" required></textarea>

        <button type="submit">إرسال الرسالة</button>
    </form>

    <p><a href="index.html">العودة للرئيسية</a></p>

</div>

<footer>
    جميع الحقوق محفوظة © 2026 زاد المسلم
</footer>

</body>
</html>
